[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wearable-eeg-workbench"
version = "0.1.0"
description = "Team workbench for wearable EEG/IMU acquisition, quality checks, preprocessing, and reporting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
]

[project.optional-dependencies]
research = [
  "scipy>=1.11",
  "mne>=1.6",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
]

[project.scripts]
wearable-eeg = "wearable_eeg.cli:main"
eeg-team = "team_platform.app:run"

[tool.setuptools.packages.find]
include = ["wearable_eeg*", "team_platform*"]

